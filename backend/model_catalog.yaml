# MediaSage model catalog (bundled defaults)
#
# Override any part of this file by provisioning your own YAML file at
# `config/models.yaml` (or the path set in MEDIASAGE_MODELS_FILE). Your file is
# deep-merged over this one, so it only needs the keys you want to change.
#
#   providers.<provider>.analysis    Smart model: prompt analysis, filters, narrative
#   providers.<provider>.generation  Cheaper model: picks tracks from the filtered list
#   models.<model_id>.input_cost     USD per million input tokens
#   models.<model_id>.output_cost    USD per million output tokens
#   models.<model_id>.context_window Usable input tokens (drives max tracks sent)
#
# Unknown models fall back to 128K context and $1 / $2 per million tokens.
# Prices checked September 2026.

providers:
  anthropic:
    analysis: claude-opus-5-5
    generation: claude-sonnet-5-5
  openai:
    analysis: gpt-6-sol
    generation: gpt-6-luna
  gemini:
    analysis: gemini-3.8-flash
    generation: gemini-3.5-flash-lite

models:
  # Anthropic
  claude-fable-5-1: {input_cost: 10.00, output_cost: 50.00, context_window: 1000000}
  claude-opus-5-5: {input_cost: 4.00, output_cost: 20.00, context_window: 1000000}
  claude-sonnet-5-5: {input_cost: 2.00, output_cost: 10.00, context_window: 1000000}
  claude-haiku-4-5: {input_cost: 1.00, output_cost: 5.00, context_window: 200000}
  # OpenAI (inputs above 272K tokens are billed ~2x)
  gpt-6-astra: {input_cost: 10.00, output_cost: 50.00, context_window: 922000}
  gpt-6-sol: {input_cost: 2.00, output_cost: 10.00, context_window: 922000}
  gpt-6-luna: {input_cost: 0.10, output_cost: 0.50, context_window: 922000}
  gpt-5.6-sol: {input_cost: 4.00, output_cost: 20.00, context_window: 922000}
  gpt-5.6-terra: {input_cost: 2.00, output_cost: 12.00, context_window: 922000}
  gpt-5.6-luna: {input_cost: 0.20, output_cost: 1.20, context_window: 922000}
  # Google Gemini (gemini-3.8-flash: introductory price until 2026-12-31, then $1.50 / $7.50)
  gemini-3.8-flash: {input_cost: 0.75, output_cost: 3.75, context_window: 1048576}
  gemini-3.5-flash: {input_cost: 1.50, output_cost: 9.00, context_window: 1048576}
  gemini-3.5-flash-lite: {input_cost: 0.30, output_cost: 2.50, context_window: 1048576}
  gemini-3.1-pro-preview: {input_cost: 2.00, output_cost: 12.00, context_window: 1048576}
